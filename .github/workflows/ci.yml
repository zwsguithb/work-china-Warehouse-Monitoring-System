name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (import sanity)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test - app imports & DB init
        run: |
          python -c "from app import database; database.init_db(); print('DB init OK')"
          python -c "import app.lingxing as lx; print('lingxing module OK; paths:', lx.FBA_STOCK_PATH, lx.FULL_STOCK_PATH, lx.FBT_STOCK_PATH, lx.DAILY_SALES_PATH)"

      - name: Build Docker image
        run: docker build -t cwms:ci .

      - name: Run container & smoke test endpoints
        run: |
          docker run -d --name cwms -p 8000:8000 cwms:ci
          sleep 8
          curl -s -o /dev/null -w "index:%{http_code}\n" http://127.0.0.1:8000/
          curl -s http://127.0.0.1:8000/api/dashboard/eliminated | head -c 80; echo
          curl -s http://127.0.0.1:8000/api/lingxing/status; echo
          curl -s "http://127.0.0.1:8000/api/lingxing/sync-log" | head -c 80; echo
          docker rm -f cwms || true
